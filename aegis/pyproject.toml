[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "1.0.0"
description = "Constellation conjunction assessment and collision avoidance"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "sgp4",
    "requests",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# The research layer. `aegis.fleetopt`, `aegis.scenarios` and
# `aegis.experiments` need nothing beyond the base dependencies; these are for
# the learning and storage layers, and every module that uses them imports
# them lazily so the package still imports without them.
research = ["torch>=2.0", "pyarrow>=14", "pandas"]
cloud = ["boto3", "google-cloud-storage", "psycopg[binary]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis = ["ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
